name: Playwright E2E Manual

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag, or SHA to test against.
        required: true
        default: develop

permissions:
  contents: read

concurrency:
  group: e2e-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 3000
  DATABASE_URL: postgresql://speedcubers:speedcubers@localhost:5432/speedcubers_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-e2e-jwt-secret
  JWT_REFRESH_SECRET: ci-e2e-refresh-secret
  AGORA_APP_ID: '00000000000000000000000000000000'
  AGORA_APP_CERTIFICATE: '11111111111111111111111111111111'
  ALLOWED_ORIGINS: http://localhost:5173
  E2E_BASE_URL: http://localhost:5173
  E2E_API_URL: http://localhost:3000/api/v1
  E2E_SOCKET_URL: http://localhost:3000
  E2E_BACKEND_HEALTH_URL: http://localhost:3000/health
  VITE_API_URL: http://localhost:3000/api/v1
  VITE_SOCKET_URL: http://localhost:3000
  VITE_AGORA_APP_ID: ci-placeholder

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:14-alpine
        env:
          POSTGRES_USER: speedcubers
          POSTGRES_PASSWORD: speedcubers
          POSTGRES_DB: speedcubers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U speedcubers -d speedcubers_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: edulumulu/speedcubers-pulse-backend
          ref: ${{ inputs.backend_ref }}
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare backend database
        working-directory: backend
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Start backend
        working-directory: backend
        run: |
          nohup npm run start > ../backend.log 2>&1 &
          echo $! > ../backend.pid

          for i in {1..60}; do
            if curl -fsS "$E2E_BACKEND_HEALTH_URL"; then
              exit 0
            fi
            sleep 1
          done

          cat ../backend.log
          exit 1

      - name: Run Playwright E2E
        id: e2e
        run: npm run test:e2e

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            backend.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize result
        if: always()
        run: |
          echo "## Playwright E2E" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend ref: \`${{ inputs.backend_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ steps.e2e.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
